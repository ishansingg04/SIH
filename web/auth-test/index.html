<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediKiosk Auth Test</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; background: #f9f9f9; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.5rem; box-sizing: border-box; }
        button { background: #0066cc; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0052a3; }
        pre { background: #333; color: #fff; padding: 1rem; overflow-x: auto; border-radius: 4px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>MediKiosk Auth Console</h1>
    
    <div id="unauth-section">
        <div class="card">
            <h2>Patient Registration</h2>
            <form id="register-form">
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="reg-phone" placeholder="+919876543210" required>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" placeholder="Asha Devi" required>
                </div>
                <div class="form-group">
                    <label>Language</label>
                    <input type="text" id="reg-lang" value="hi" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" placeholder="SecurePassword123!" required>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="reg-consent" required> I consent to terms</label>
                </div>
                <button type="submit">Register</button>
            </form>
        </div>

        <div class="card">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email or Phone</label>
                    <input type="text" id="login-id" placeholder="+919876543210 or email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <div id="auth-section" class="hidden">
        <div class="card">
            <h2>Authenticated Session</h2>
            <p><strong>Access Token Preview:</strong> <span id="token-preview"></span>...</p>
            <button id="logout-btn">Logout</button>
        </div>

        <div class="card">
            <h2>My Patient Profile</h2>
            <button id="fetch-profile-btn">Fetch Profile (/patients/me)</button>
            <pre id="profile-output">{}</pre>
            
            <hr style="margin: 1.5rem 0;">
            
            <h3>Update Language</h3>
            <form id="update-form">
                <div class="form-group">
                    <input type="text" id="update-lang" placeholder="en or hi" required>
                </div>
                <button type="submit">Update Profile</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        let currentToken = null;

        function updateUI() {
            if (currentToken) {
                document.getElementById('unauth-section').classList.add('hidden');
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('token-preview').textContent = currentToken.substring(0, 20);
            } else {
                document.getElementById('unauth-section').classList.remove('hidden');
                document.getElementById('auth-section').classList.add('hidden');
            }
        }

        async function handleApi(endpoint, options = {}) {
            if (currentToken) {
                options.headers = { ...options.headers, 'Authorization': `Bearer ${currentToken}` };
            }
            try {
                const res = await fetch(`${API_URL}${endpoint}`, options);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error ? data.error.message : 'API Error');
                return data;
            } catch (err) {
                alert(err.message);
                throw err;
            }
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                phone: document.getElementById('reg-phone').value,
                name: document.getElementById('reg-name').value,
                language: document.getElementById('reg-lang').value,
                password: document.getElementById('reg-password').value,
                consent: document.getElementById('reg-consent').checked,
            };
            await handleApi('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            alert('Registered successfully! Now login.');
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                email: document.getElementById('login-id').value,
                password: document.getElementById('login-password').value,
            };
            const data = await handleApi('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            currentToken = data.data.access_token;
            updateUI();
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            currentToken = null;
            updateUI();
        });

        document.getElementById('fetch-profile-btn').addEventListener('click', async () => {
            const data = await handleApi('/patients/me');
            document.getElementById('profile-output').textContent = JSON.stringify(data.data, null, 2);
        });

        document.getElementById('update-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const lang = document.getElementById('update-lang').value;
            const data = await handleApi('/patients/me', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ language: lang })
            });
            document.getElementById('profile-output').textContent = JSON.stringify(data.data, null, 2);
            alert('Updated!');
        });
    </script>
</body>
</html>
