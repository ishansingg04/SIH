# Root alembic.ini pointing to apps/api/app/db/migrations

[alembic]
script_location = apps/api/app/db/migrations
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40
version_locations = %(here)s/apps/api/app/db/migrations/versions
output_encoding = utf-8
sqlalchemy.url = postgresql+psycopg://medikiosk:medikiosk@localhost:5432/medikiosk

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic
